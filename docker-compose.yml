version: '3.8'

services:
  faq-system:
    build: .
    container_name: faq_intelligent_service
    ports:
      - "8000:8000"
    environment:
      - BALE_BOT_TOKEN=your_actual_token_here_or_in_env_file
    volumes:
      - ./faiss_index:/app/faiss_index  # Mounts local index so container can read/write it
    restart: always